name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test -- --run

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing release assets for tag: ${TAG}..."

          # Check if a release exists and if it is currently a draft
          IS_DRAFT=$(gh release view "${TAG}" --json isDraft -q .isDraft 2>/dev/null || echo "NOT_FOUND")

          if [ "${IS_DRAFT}" = "NOT_FOUND" ]; then
            echo "No existing release found. Creating draft release and uploading assets..."
            gh release create "${TAG}" release/*.exe release/*.exe.blockmap release/latest.yml \
              --title "${TAG}" \
              --generate-notes \
              --draft \
              --verify-tag

            echo "Assets uploaded successfully. Publishing release..."
            gh release edit "${TAG}" --draft=false
          elif [ "${IS_DRAFT}" = "true" ]; then
            echo "Existing draft release found. Uploading assets..."
            gh release upload "${TAG}" release/*.exe release/*.exe.blockmap release/latest.yml --clobber

            echo "Assets uploaded successfully. Publishing release..."
            gh release edit "${TAG}" --draft=false
          else
            echo "Existing published release found. Updating assets..."
            gh release upload "${TAG}" release/*.exe release/*.exe.blockmap release/latest.yml --clobber
          fi
